[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugtrace"
version = "0.1.0"
description = "AI-assisted git bisect for tracing when a bug was introduced."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Codex" }
]

[project.scripts]
bugtrace = "bugtrace.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
